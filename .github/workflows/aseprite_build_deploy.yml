
name: Build Aseprite Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          path: aseprite
          submodules: recursive

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Download compatible Skia
        shell: bash
        working-directory: aseprite
        run: |
          SKIA_URL=$(bash laf/misc/skia-url.sh Release)
          echo "Skia URL: $SKIA_URL"
          curl -fL --retry 3 -o skia.zip "$SKIA_URL"
          mkdir skia
          unzip -q skia.zip -d skia

      
      - name: Configure Aseprite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vsPath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          if (!(Test-Path $vsPath)) {
            throw "Visual Studio C++ build tools not found"
          }

          $skia = "${{ github.workspace }}/aseprite/skia"

          $cmd = "call `"$vsPath`" && cmake -S aseprite -B aseprite/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DLAF_BACKEND=skia -DSKIA_DIR=`"$skia`" -DSKIA_LIBRARY_DIR=`"$skia/out/Release-x64`" -DENABLE_SCRIPTING=ON"

          cmd /c $cmd

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }


      - name: Build Aseprite
        shell: pwsh
        run: |
          cmake --build aseprite/build --target aseprite
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package executable
        shell: pwsh
        run: |
          $bin = "aseprite/build/bin"
          if (!(Test-Path "$bin/aseprite.exe")) {
            throw "aseprite.exe not found"
          }
          Compress-Archive -Path "$bin/*" `
            -DestinationPath "aseprite-windows.zip"

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows
          path: aseprite-windows.zip
          retention-days: 1
